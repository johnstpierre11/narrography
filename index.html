<!DOCTYPE html>
<head>
    <title>Narrography</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Platypi:ital,wght@0,300..800&family=Lato:ital,wght@0,300&family=Atkinson+Hyperlegible+Mono:ital,wght@0,300&display=swap');

        body {
            background-color: #ffdd55;
            color: #111111;
            text-align: center;
        }

        h1 {
            font-size: 96px;
            font-family: 'Platypi', serif;
            font-weight: 800;
        }

        p {
            font-size: 32px;
            font-family: 'Lato', sans-serif;
            font-weight: 300;
        }

        .mono {
            font-family: 'Atkinson Hyperlegible Mono', monospace;
            font-weight: 300;
        }

<body>

    <h1>Narrography</h1>
    <p class="mono">: | [] —–- // *</p>
